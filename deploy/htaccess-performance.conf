# BEGIN APPSTV performance (v1.0.38) - source: deploy/htaccess-performance.conf, do not edit here
# Placed in the site's root .htaccess (per-server file, not in git) below the cPanel PHP handler block.
# 1. Compression: text responses (pages, JSON from webservice.php, JS, CSS, SVG, fonts) are gzipped, ~4x smaller.
# 2. Browser cache:
#    - theme / vendor files (assets/plugins, assets/css, assets/js, assets/media) and fonts: 30 days. They only change
#      when the theme is upgraded; a theme upgrade must rename the files or add ?v= to their links.
#    - images anywhere: 7 days.
#    - the app's own JS / CSS (assets/scodezy, assets/appstv, plugins/*): "no-cache" = the browser keeps them but asks
#      the server each time (answered "304 Not Modified" when unchanged), so a deploy shows at once.
#    PHP pages and webservice answers keep their own headers (no rule here touches them).
# 3. The deploy/ folder (this file) is not served.

RedirectMatch 404 ^/deploy/

<IfModule mod_deflate.c>
  <IfModule mod_filter.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject
  </IfModule>
</IfModule>

<IfModule mod_headers.c>
  <FilesMatch "\.(js|css)$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
  <FilesMatch "\.(png|jpe?g|gif|webp|ico|svg)$">
    Header set Cache-Control "public, max-age=604800"
  </FilesMatch>
  <FilesMatch "\.(woff2?|ttf|otf|eot)$">
    Header set Cache-Control "public, max-age=2592000"
  </FilesMatch>
  <If "%{REQUEST_URI} =~ m#/assets/(plugins|css|js|media)/#">
    Header set Cache-Control "public, max-age=2592000"
  </If>
</IfModule>
# END APPSTV performance (v1.0.38)
